# Gives the pods one public IP address (Azure creates a load balancer).
# Visitors use port 80; traffic is forwarded to the app's port 8080.
apiVersion: v1
kind: Service
metadata:
  name: hello-app
spec:
  type: LoadBalancer
  selector:
    app: hello-app
  ports:
    - port: 80
      targetPort: 8080
